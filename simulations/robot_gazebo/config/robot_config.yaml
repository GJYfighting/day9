controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: forward_command_controller/ForwardCommandController
gz_ros2_control:
  ros__parameters:
    position_proportional_gain: 0.1
joint_state_broadcaster:
  ros__parameters:
    joints:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - r_joint
    interfaces:
    - position
    - velocity
    - effort
arm_controller:
  ros__parameters:
    joints:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    allow_partial_joints_goal: false
    open_loop_control: false
    allow_integration_in_goal_trajectories: false
    constraints:
      goal_time: 5.0
      stopped_velocity_tolerance: 0.15
gripper_controller:
  ros__parameters:
    joints:
    - r_joint
    interface_name: effort
